<details class="attr-images">
  <summary>Product images — replace</summary>
  <p class="hint">Choose a file for any slot you want to change, then press Upload
    new images. <strong>Remove</strong> clears that slot on its own, straight away.
    Slots you leave alone are untouched. Minimum 700×700, max 10 MB.</p>
  {% for s in p.image_slots %}
  <label class="hint attr-slot">
    <span class="mono">{{ s.header }}</span>
    {% with ordinal = p.ordinal, slot = s.slot, url = s.url, header = s.header, oob = False %}
      {% include "_slot_thumb.html" %}
    {% endwith %}
    <input type="file" name="img__{{ p.ordinal }}__{{ s.slot }}" accept="image/*">
    {# Only a filled slot can be cleared. An empty one would post a removal that
       writes the blank it already holds.

       A button, not a checkbox: a tick that only took effect on the "Upload new
       images" button read as broken, because nothing happened when it was
       ticked. This posts on its own click and clears the slot straight away.

       hx-include pulls ONLY the hidden SKU field, never the panel: including the
       panel would re-post every file input alongside the removal, turning one
       click into an upload of whatever else was chosen. #}
    {% if s.url %}
    <span class="slot-remove" id="slot-rm-{{ p.ordinal }}-{{ s.slot }}">
      <button class="btn slot-remove-btn" type="button"
              hx-post="/generate/attributes/{{ job_id }}/images"
              hx-include="[name='sku__{{ p.ordinal }}']"
              hx-vals='{"ordinal": {{ p.ordinal }}, "rm__{{ p.ordinal }}__{{ s.slot }}": "1"}'
              hx-target="#img-out-{{ p.ordinal }}"
              hx-swap="innerHTML"
              hx-disabled-elt="this">Remove</button>
    </span>
    {% else %}
    <span class="slot-remove" id="slot-rm-{{ p.ordinal }}-{{ s.slot }}"></span>
    {% endif %}
  </label>
  {% endfor %}
  <button class="btn" type="button"
          hx-post="/generate/attributes/{{ job_id }}/images"
          hx-encoding="multipart/form-data"
          hx-include="closest .attr-panel"
          hx-vals='{"ordinal": {{ p.ordinal }}}'
          hx-target="#img-out-{{ p.ordinal }}"
          hx-swap="innerHTML"
          hx-disabled-elt="this">Upload new images</button>
  <span class="attr-save-out" id="img-out-{{ p.ordinal }}"></span>
</details>
