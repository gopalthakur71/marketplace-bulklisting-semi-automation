# Deterministic per-row rules (no LLM). Applied by src/mapper.py.

# Fabric detection: first keyword found in the product name (then the Shopify
# fabric field) is used ONLY to derive the category|fabric signature fed to the
# HSN knowledge base (see src/myntra/hsn_kb.py). Saree Fabric, Blouse Fabric, and
# Wash Care are NOT written from this block anymore — see user_filled_attributes
# below; the seller fills them by hand in Excel via the template dropdowns.
fabric_detection:
  order: [cotton, silk]   # check in this order; first match wins
  cotton:
    Saree Fabric: Pure Cotton
    Blouse Fabric: Pure Cotton
    Wash Care: Hand Wash
  silk:
    Saree Fabric: Pure Silk
    Blouse Fabric: Pure Silk
    Wash Care: Dry Clean

# Some mandatory constants exist as several numbered vocab columns in the template
# (e.g. Country Of Origin, Country Of Origin2..5). The constant fills only the base
# column; list the base here to copy its value across every "<base><digits>" sibling.
replicate_constant_across_numbered:
  - "Country Of Origin"

# Attributes the user fills by hand — either in the app's "Fill attributes" screen
# or in Excel via the template dropdowns. The mapper leaves these BLANK (the app
# never guesses them). The preview and the attribute-entry screen both read this
# list to know which columns are user-owned.
user_filled_attributes:
  - Prominent Colour
  - Second Prominent Colour
  - Third Prominent Colour
  - Saree Fabric
  - Blouse Fabric
  - Type
  - Ornamentation
  - Border
  - Pattern
  - Print or Pattern Type
  - Wash Care
  - Usage

# Free-text columns the seller fills by hand. These have NO dropdown vocabulary in
# the Myntra template, so they are deliberately kept OUT of user_filled_attributes:
# everything in that list is validated by exact membership in the template's own
# vocabulary, and that rule must never be relaxed. `tags` is pre-filled by the
# pipeline from the Shopify export (column_map.yaml: tags -> tags); the seller may
# overwrite it in the app.
user_filled_freetext:
  - tags

# Assign a sequential styleGroupId to each product row, continuing from the
# seller's existing Myntra catalog. styleGroupId of row i = style_group_id_start + (i-1).
# 8 products already listed -> next group starts at 9. Bump this before each new batch.
auto_style_group_id: true
style_group_id_start: 9

# Product Details: keep only the HTML after this heading (drops the Key Features
# block, keeps the product description). Set to empty/remove to keep the full body.
product_details_after_marker: "Product Description"
